# Publica o site no GitHub Pages: a cada push na main e periodicamente,
# rodando antes o coletor de monitoramento (CEMADEN, ANA, previsão).
#
# Configuração (Settings do repositório):
#   - Pages > Source: GitHub Actions
#   - Secrets and variables > Actions > Secrets:   VITE_CESIUM_TOKEN
#   - Secrets and variables > Actions > Variables: SITE_URL  (ex.: https://usuario.github.io/repositorio)
#     Usado para recuperar os últimos dados publicados quando uma fonte falha.
#
# Custo: grátis em repositório público. Em repositório privado o plano gratuito tem
# 2.000 min/mês; a cada 30 min (~2 min por execução) passa disso — use 60 min.
name: Publicar no GitHub Pages
on:
  push: { branches: [main] }
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - name: Coletar monitoramento
        # Falha de uma fonte não interrompe a publicação: o coletor mantém os dados anteriores.
        run: |
          if [ -n "${{ vars.SITE_URL }}" ]; then
            python backend/scripts/collect_monitoring.py --anterior "${{ vars.SITE_URL }}/data/monitoramento.json"
          else
            python backend/scripts/collect_monitoring.py
          fi
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env: { VITE_CESIUM_TOKEN: "${{ secrets.VITE_CESIUM_TOKEN }}" }
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
